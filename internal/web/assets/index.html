<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahjong Score</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">MAHJONG SCORE</p>
      <h1>半荘の記録</h1>
    </div>
    <div class="header-actions">
      <a class="header-button" href="/api/export" download="mahjong-score-backup.json">エクスポート</a>
      <button id="import-button" class="header-button" type="button">インポート</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <button id="new-session-button" class="secondary-button" type="button">対局日を作成</button>
    </div>
  </header>

  <main>
    <p id="backup-message" class="backup-message" role="status" hidden></p>
    <section class="panel session-panel">
      <label for="session-select">対局日</label>
      <select id="session-select">
        <option value="">対局日を選択してください</option>
      </select>
      <div id="session-actions" class="record-actions" hidden>
        <button id="edit-session-button" class="text-button" type="button">編集</button>
        <button id="delete-session-button" class="danger-button" type="button">削除</button>
      </div>
    </section>

    <section id="score-panel" class="panel" hidden>
      <div class="panel-heading">
        <div>
          <p id="score-panel-mode" class="eyebrow">NEW GAME</p>
          <h2 id="score-panel-title">半荘結果を入力</h2>
        </div>
        <p class="rule-note">スコアは1000点単位で入力</p>
      </div>

      <form id="score-form">
        <div id="score-inputs" class="score-entry-grid"></div>
        <div class="form-footer">
          <p id="score-total">合計 0点</p>
          <a class="history-hint" href="#history-panel">半荘履歴を見る <span aria-hidden="true">↓</span></a>
          <div class="form-actions">
            <button id="cancel-game-edit" class="text-button" type="button" hidden>編集をキャンセル</button>
            <button id="save-game-button" class="primary-button" type="submit">半荘を保存</button>
          </div>
        </div>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section id="history-panel" class="panel" hidden>
      <div class="panel-heading">
        <div>
          <p class="eyebrow">HISTORY</p>
          <h2>半荘履歴</h2>
        </div>
        <div class="view-switcher" role="group" aria-label="半荘履歴の表示形式">
          <button class="view-button is-active" type="button" data-history-view="tiles" aria-pressed="true">
            <span aria-hidden="true">▦</span> タイル
          </button>
          <button class="view-button" type="button" data-history-view="table" aria-pressed="false">
            <span aria-hidden="true">☷</span> 表
          </button>
          <button class="view-button" type="button" data-history-view="chart" aria-pressed="false">
            <span aria-hidden="true">⌁</span> 得点推移
          </button>
        </div>
      </div>
      <div id="games" class="games"></div>
    </section>
  </main>

  <dialog id="session-dialog">
    <form id="session-form">
      <div class="dialog-heading">
        <h2 id="session-dialog-title">対局日を作成</h2>
        <button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <label>名前<input id="session-name" required placeholder="水曜セット"></label>
      <label>日付<input id="session-date" type="date" required></label>
      <p id="session-message" class="message" role="status"></p>
      <button id="save-session-button" class="primary-button" type="submit">作成する</button>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
