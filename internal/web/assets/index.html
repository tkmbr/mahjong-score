<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahjong Score</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">MAHJONG SCORE</p>
      <h1>半荘の記録</h1>
    </div>
    <button id="new-session-button" class="secondary-button" type="button">対局日を作成</button>
  </header>

  <main>
    <section class="panel session-panel">
      <label for="session-select">対局日</label>
      <select id="session-select">
        <option value="">対局日を選択してください</option>
      </select>
    </section>

    <section id="score-panel" class="panel" hidden>
      <div class="panel-heading">
        <div>
          <p class="eyebrow">NEW GAME</p>
          <h2>半荘結果を入力</h2>
        </div>
        <p class="rule-note">25,000点持ち・30,000点返し</p>
      </div>

      <form id="score-form">
        <div class="score-table-wrap">
          <table class="score-table">
            <thead>
              <tr><th>プレイヤー</th><th>素点</th></tr>
            </thead>
            <tbody id="score-inputs"></tbody>
          </table>
        </div>
        <div class="form-footer">
          <p id="score-total">合計 0点</p>
          <button class="primary-button" type="submit">半荘を保存</button>
        </div>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section id="history-panel" class="panel" hidden>
      <div class="panel-heading">
        <div>
          <p class="eyebrow">HISTORY</p>
          <h2>半荘履歴</h2>
        </div>
      </div>
      <div id="games" class="games"></div>
    </section>
  </main>

  <dialog id="session-dialog">
    <form id="session-form">
      <div class="dialog-heading">
        <h2>対局日を作成</h2>
        <button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <label>名前<input id="session-name" required placeholder="水曜セット"></label>
      <label>日付<input id="session-date" type="date" required></label>
      <p id="session-message" class="message" role="status"></p>
      <button class="primary-button" type="submit">作成する</button>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
